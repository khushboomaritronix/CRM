server {
    listen 80;
    server_name mtxcrm-qat.maritronix.in;

    # TODO: no HTTPS/443 listener configured here yet. production.py has
    # SECURE_SSL_REDIRECT=True and trusts X-Forwarded-Proto for HTTPS
    # detection (SECURE_PROXY_SSL_HEADER) — decide whether this nginx
    # terminates SSL itself (needs a `listen 443 ssl;` block + certificate,
    # e.g. via certbot) or a load balancer/CDN in front of it does (in which
    # case proxy_params' `X-Forwarded-Proto $scheme;` needs to NOT overwrite
    # whatever that upstream already set). Left untouched for now.

    # react-scripts build (this project's actual build command) outputs to
    # build/, not dist/ — this project has no CRACO/config-overrides/
    # BUILD_PATH changing that.
    root /home/devadmin/crmqat/CRM/crm_frontend/build;
    index index.html;

    # Django's own static files (admin CSS/JS, Swagger UI assets) — deliberately
    # NOT /static/, since that collides with the React build's own JS/CSS
    # bundle (served at /static/js/..., /static/css/... via the root below)
    # and silently 404s the whole frontend. See STATIC_URL in
    # config/settings/{base,production}.py.
    location /django-static/ {
        alias /home/devadmin/crmqat/CRM/crm_backend/staticfiles/;
    }

    location /media/ {
        alias /home/devadmin/crmqat/CRM/crm_backend/media/;
    }

    # Covers /api/schema/ and /api/docs/ too — both live under /api/ in
    # config/urls.py, there's no bare top-level /schema/ or /docs/ route in
    # this app, so those as separate location blocks were dead (nothing on
    # the Django side ever matches them without the /api/ prefix).
    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/run/crmqat.sock;
    }

    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/crmqat.sock;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 100M;
}
