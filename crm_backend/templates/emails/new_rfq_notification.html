{% extends "emails/base_email.html" %}
{% block content %}
  <p style="margin:0 0 16px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#B0552A;font-weight:700;">New RFQ created</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
    <tr><td style="padding:5px 0;color:#5B6570;width:110px;">RFQ</td><td style="padding:5px 0;font-weight:700;">{{ rfq.rfq_number }}</td></tr>
    <tr><td style="padding:5px 0;color:#5B6570;">Vendor</td><td style="padding:5px 0;">{{ rfq.vendor.name|default:"—" }}</td></tr>
    <tr><td style="padding:5px 0;color:#5B6570;">Items</td><td style="padding:5px 0;">{{ item_count }}</td></tr>
  </table>
  <p style="margin:0 0 24px;text-align:center;">
    <a href="{{ frontend_url }}" style="display:inline-block;background:#2E86AB;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:6px;font-weight:700;font-size:14px;">View in dashboard</a>
  </p>
{% endblock %}
